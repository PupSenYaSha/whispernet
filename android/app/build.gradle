apply plugin: 'com.android.application'

// one source of truth for the version: package.json. Bumping it there is enough, and a frozen
// versionCode made a rebuilt APK impossible to install over the one already on the phone.
def appVersion = new groovy.json.JsonSlurper().parseText(file('../../package.json').text).version
def appVersionCode = {
    def parts = appVersion.split(/\./)
    def major = parts[0].replaceAll(/\D/, '')
    def minor = parts.size() > 1 ? parts[1].replaceAll(/\D/, '') : '0'
    def patch = parts.size() > 2 ? parts[2].replaceAll(/\D/, '') : '0'
    (major.toInteger() * 10000) + (minor.toInteger() * 100) + patch.toInteger()
}()

android {
    namespace = "com.whispernet.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.whispernet.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode project.hasProperty('versionCodeOverride') ? project.versionCodeOverride.toInteger() : appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // the release key lives on the build machine or in CI only, so a checkout without it can
        // still assemble the debug variant instead of failing outright
        release {
            def storePath = project.findProperty('WHISPERNET_KEYSTORE') ?: System.getenv('WHISPERNET_KEYSTORE')
            if (storePath && file(storePath).exists()) {
                storeFile file(storePath)
                storePassword project.findProperty('WHISPERNET_KEYSTORE_PASSWORD') ?: System.getenv('WHISPERNET_KEYSTORE_PASSWORD')
                keyAlias project.findProperty('WHISPERNET_KEY_ALIAS') ?: System.getenv('WHISPERNET_KEY_ALIAS')
                keyPassword project.findProperty('WHISPERNET_KEY_PASSWORD') ?: System.getenv('WHISPERNET_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// No `flatDir` and no `fileTree` here, deliberately.
//
// Both existed to pick up jars dropped into `libs/` by the Cordova bridge. There are no Cordova plugins in
// this project - `capacitor-cordova-android-plugins/src/main/libs` does not exist - and `android/app/libs`
// does not exist either, so both were resolving nothing. What they cost is a repository declaration that
// bypasses dependency verification and version metadata entirely, pointed at a directory that is *not*
// gitignored: one committed `.jar` would be dexed straight into a signed release APK with no provenance, no
// version and nothing in the diff that says where it came from. If a jar ever is needed, it belongs in a
// real repository with a checksum, not in a path Gradle scans silently.
// `android/app/libs/` is gitignored now as well, so the directory cannot be committed by accident.

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
