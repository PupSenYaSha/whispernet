name: Build binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload the built assets to (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:client
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 'Package Windows installers (Tauri nsis + msi)'
        run: npm run tauri build -- --bundles nsis,msi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Collect assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\build | Out-Null
          Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Copy-Item -Destination dist\build -Force
          Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" | Copy-Item -Destination dist\build -Force
          Compress-Archive -Path "src-tauri\target\release\whispernet.exe" -DestinationPath "dist\build\whispernet.exe.zip" -Force
          $hash = (Get-FileHash "dist\build\whispernet.exe.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  whispernet.exe.zip" | Set-Content -Encoding ascii "dist\build\whispernet.exe.zip.sha256"
          Get-ChildItem dist\build | Select-Object Name, Length
      - name: Upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          gh release upload "$TAG" dist/build/*.exe dist/build/*.msi dist/build/*.zip dist/build/*.sha256 --clobber

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:client
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Package Linux .deb (Tauri)
        run: npm run tauri build -- --bundles deb
      - name: Upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          gh release upload "$TAG" src-tauri/target/release/bundle/deb/*.deb --clobber

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:client
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        # the runner image ships the SDK, but the licenses are not accepted yet, which is what
        # made android-actions/setup-android fail on its internal sdkmanager call
        run: |
          SDKMGR=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
      - name: Install the SDK packages the app builds against
        run: |
          SDKMGR=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager | tail -1)
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Sync Capacitor
        run: node node_modules/@capacitor/cli/bin/capacitor sync android
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug -x lint -no-daemon
      - name: Upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk WhisperNet.apk
          gh release upload "$TAG" WhisperNet.apk --clobber
