name: Build binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload the built assets to (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

# two dispatches for the same tag would interleave their uploads
concurrency:
  group: binaries-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Read the version the build will report
        id: check
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "package.json=$PKG tauri=$TAURI cargo=$CARGO tag=$TAG"
          if [ "$TAG" != "v$PKG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi
          if [ "$PKG" != "$TAURI" ] || [ "$PKG" != "$CARGO" ]; then
            echo "::error::versions disagree: package.json=$PKG tauri=$TAURI cargo=$CARGO"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 'Package the Windows installer (Tauri nsis)'
        run: npm run tauri build -- --bundles nsis
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Collect assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\build | Out-Null
          Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Copy-Item -Destination dist\build -Force
          # the desktop updater replaces the running binary in place, so the release also needs a
          # plain zip holding the executable; without it the update check found nothing to install
          $ver = "${{ needs.verify.outputs.version }}"
          Compress-Archive -Path "src-tauri\target\release\whispernet.exe" `
                            -DestinationPath "dist\build\WhisperNet_${ver}_x64-portable.zip" -Force
          # The updater refuses a build with no published digest, so the digest is published beside it.
          # Without these files every in-app update is refused, which is the whole point of the check:
          # a checksum nobody publishes is a checksum nobody can check against.
          Get-ChildItem dist\build -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Path "$($_.FullName).sha256" -NoNewline -Encoding ascii
          }
          Get-ChildItem dist\build | Select-Object Name, Length
      - name: Upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" dist/build/*.exe dist/build/*.zip dist/build/*.sha256 --clobber

  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Package Linux .deb (Tauri)
        run: npm run tauri build -- --bundles deb
      - name: Publish the digest beside the package
        # The updater's check is that a published checksum exists and matches; a package with no digest
        # beside it cannot be verified by anybody, which is the same for a .deb as for the zip.
        run: |
          set -euo pipefail
          for f in src-tauri/target/release/bundle/deb/*.deb; do
            sha256sum "$f" > "$f.sha256"
            cat "$f.sha256"
          done
      - name: Upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/deb/*.deb.sha256 --clobber

  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        # the runner image ships the SDK, but the licenses are not accepted yet, which is what
        # made android-actions/setup-android fail on its internal sdkmanager call
        run: |
          SDKMGR=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
      - name: Install the SDK packages the app builds against
        run: |
          SDKMGR=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager | tail -1)
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build the web client
        # `cap copy` copies `webDir` out of the build output, so the output has to exist before it runs.
        # Without this the assets directory is never created, and the `update` step that follows then fails
        # on a generated file it cannot find — which is what this job did on the first run after the client
        # stopped being committed.
        run: |
          node scripts/strip-bom.js
          npm run build:client
      - name: Sync Capacitor
        run: node node_modules/@capacitor/cli/bin/capacitor sync android
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up the release signing key
        # the APK has to be signed with a real key: a debug key is shared, derivable by anyone and
        # leaves the build debuggable
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed APK"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/whispernet-release.jks
          echo "WHISPERNET_KEYSTORE=$PWD/android/app/whispernet-release.jks" >> "$GITHUB_ENV"
          echo "WHISPERNET_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "WHISPERNET_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "WHISPERNET_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease -no-daemon
      - name: Upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk WhisperNet.apk
          sha256sum WhisperNet.apk > WhisperNet.apk.sha256
          gh release upload "$TAG" WhisperNet.apk WhisperNet.apk.sha256 --clobber
