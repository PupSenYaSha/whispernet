name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A byte order mark is invisible in an editor and harmless in most tools, which is why it survives
      # until the strictest one in the chain meets it: Gradle read `build.gradle` as `?apply plugin` and
      # failed with a parse error at line 1 column 1, three bytes before anything it could name. Caught
      # here rather than in the release build, which is where it was caught.
      - name: Strip stray byte order marks
        run: node scripts/strip-bom.js

      - name: Typecheck
        # one script, so client, server and tests are all covered; re-listing the projects here is
        # how tests/ quietly stopped being checked
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build client
        run: npm run build:client

      - name: Tests
        run: npm test

      - name: Audit shipped dependencies
        # Only what actually gets shipped and runs on a server or a phone. A DoS in a glob parser that
        # only ever sees patterns from this repository, at build time, on a maintainer's machine, is not
        # the same thing as one an attacker can reach by sending a multipart body -- and gating on it
        # only teaches everyone to ignore a red build.
        run: npm audit --omit=dev --audit-level=high

      - name: Report build-time dependency advisories
        # Kept visible rather than hidden, so the dev chain is not quietly forgotten. It does not fail
        # the build: the remaining advisories are all under tailwindcss, and clearing them means a
        # semver-major upgrade of the styling toolchain.
        run: npm audit --audit-level=high || true
