name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # one script, so client, server and tests are all covered; re-listing the projects here is
        # how tests/ quietly stopped being checked
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build client
        run: npm run build:client

      - name: Tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high
