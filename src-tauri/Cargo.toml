[package]
name = "whispernet"
version = "0.2.0"
description = "WhisperNet desktop shell (Tauri / WebView2)"
edition = "2021"

[lib]
name = "whispernet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
ureq = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zip = { version = "3", default-features = false, features = ["deflate"] }
